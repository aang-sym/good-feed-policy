name: Publish policy page

# Publishes docs/site/ to GitHub Pages — the support and privacy URL App Store
# Connect requires. This repo exists to host only that page, kept separately
# and permanently public so the main app repo (private) doesn't need a paid
# GitHub plan just to keep Pages working.
#
# One-time setup (repo Settings → Pages): Source = GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

      - id: deployment
        uses: actions/deploy-pages@v4
